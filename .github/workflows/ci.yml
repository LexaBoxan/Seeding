name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Run tests
        run: |
          python -m pytest --cov=seeding --cov-report=term-missing --cov-report=xml tests

      - name: Run flake8
        run: |
          python -m flake8 \
            seeding/controllers.py \
            seeding/inference.py \
            seeding/services.py \
            seeding/models.py \
            seeding/storage.py \
            seeding/ui/icon_manager.py \
            seeding/ui/tree_widget.py \
            seeding/ui/export_dialog.py \
            seeding/ui/metrics.py \
            seeding/ui/preferences.py \
            seeding/ui/theme_manager.py \
            seeding/ui/layout_state.py \
            seeding/ui/i18n.py \
            tests/test_app_controller.py \
            tests/test_export_service.py \
            tests/test_image_service.py \
            tests/test_inference.py \
            tests/test_icon_manager.py \
            tests/test_layout_state.py \
            tests/test_main_window_resilience.py \
            tests/test_settings_dialog.py \
            tests/test_storage_service.py \
            tests/test_tree_widget.py \
            tests/test_ui_localization_panels.py

      - name: Check translation sources
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              "seeding/resources/translations/app_ru.ts",
              "seeding/resources/translations/app_en.ts",
          ]
          missing = [path for path in required if not Path(path).is_file()]
          if missing:
              raise SystemExit(f"Missing translation files: {missing}")
          print("Translation source files are present.")
          PY

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Audit dependencies
        run: |
          python -m pip_audit

  package-windows:
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-packaging.txt
          python -m pip install -e .

      - name: Build Windows bundle
        run: |
          python -m PyInstaller --noconfirm --clean packaging/pyinstaller/Seeding.spec

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v7
        with:
          name: seeding-windows-dist-py311
          path: dist/Seeding
          if-no-files-found: error
          compression-level: 0

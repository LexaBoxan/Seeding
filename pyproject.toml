[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seeding"
version = "4.0.0"
description = "Приложение для анализа изображений с детекцией YOLOv8"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt5>=5.15",
    "qt-material>=2.14",
    "numpy>=1.23",
    "opencv-python>=4.7.0",
    "Pillow>=9.4.0",
    "PyMuPDF>=1.22.0",
    "platformdirs>=4.3.0",
    "ultralytics>=8.0.0",
    "reportlab>=3.6.0",
]

[project.optional-dependencies]
onnx = [
    "onnxruntime>=1.20.0",
]

[project.scripts]
seeding = "seeding:main"

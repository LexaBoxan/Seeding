# ==== РАЗМЕРЫ ====
imgsz: 1280
batch: 4
workers: 0
rect: true
cache: true

# ==== ОПТИМИЗАЦИЯ ====
optimizer: AdamW
lr0: 0.001
lrf: 0.01
weight_decay: 0.015
warmup_epochs: 5
cos_lr: true
amp: true

# ==== АУГМЕНТАЦИИ ====
mosaic: 0.0
mixup: 0.0

hsv_h: 0.015
hsv_s: 0.4
hsv_v: 0.3

fliplr: 0.2
flipud: 0.0
degrees: 5.0
translate: 0.05
scale: 0.15
shear: 0.0
perspective: 0.0

# ==== ОБУЧЕНИЕ ====
epochs: 50
patience: 60
save_period: 25

# ==== ПРОЧЕЕ ====
pretrained: true
